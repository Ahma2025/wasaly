<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FB5A3C" />
  <title>وصلّي - لوحة الإدارة</title>
  <link rel="icon" type="image/png" href="./logo.png" />
  <link rel="apple-touch-icon" href="./logo.png" />
  <style>
    #wasaly-splash {
      position: fixed; inset: 0; z-index: 99999;
      background: linear-gradient(135deg, #FF8A1E 0%, #FB5A3C 55%, #F53B57 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .35s ease; font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
    }
    #wasaly-splash.hidden { opacity: 0; pointer-events: none; }
    #wasaly-splash .glow { position: absolute; width: 120vw; height: 120vw; border-radius: 50%; background: rgba(255,255,255,.12); top: -40vw; left: -10vw; }
    #wasaly-splash img { width: 96px; height: 96px; border-radius: 28px; box-shadow: 0 18px 40px rgba(0,0,0,.18); animation: pop .5s cubic-bezier(.2,.8,.2,1) both; }
    #wasaly-splash h1 { font-size: 40px; font-weight: 900; color: #fff; margin: 18px 0 4px; animation: up .4s ease .1s both; }
    #wasaly-splash p { font-size: 15px; color: rgba(255,255,255,.88); font-weight: 600; margin: 0 0 32px; animation: up .4s ease .2s both; }
    #wasaly-splash .track { width: 46vw; max-width: 200px; height: 4px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
    #wasaly-splash .fill { height: 100%; width: 40%; background: #fff; border-radius: 4px; animation: slide 1s ease-in-out infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
    @keyframes slide { 0% { transform: translateX(160%); } 100% { transform: translateX(-260%); } }
  </style>
  <script type="module" crossorigin src="./assets/index-DQ2Ktn_K.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CRl3A0m1.css">
</head>
<body>
  <div id="wasaly-splash">
    <div class="glow"></div>
    <img src="./logo.png" alt="وصلّي" />
    <h1>وصلّي</h1>
    <p>لوحة الإدارة</p>
    <div class="track"><div class="fill"></div></div>
  </div>
  <div id="root"></div>
  <script>
    (function () {
      var done = false;
      window.__hideSplash = function () {
        if (done) return; done = true;
        var s = document.getElementById('wasaly-splash');
        if (s) { s.classList.add('hidden'); setTimeout(function () { s.remove(); }, 380); }
      };
      // حدّ أقصى 1.2 ثانية حتى لو تأخّر التطبيق
      setTimeout(window.__hideSplash, 1200);
    })();
  </script>
</body>
</html>
