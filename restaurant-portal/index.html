<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF6B00" />
  <title>وصلّي - بوابة المطعم</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <style>
    html, body { margin: 0; background: #F6F7FB; }
    /* شاشة بداية خفيفة: تختفي فور جاهزية التطبيق (حد أقصى 1.2 ثانية) */
    #app-splash {
      position: fixed; inset: 0; z-index: 99999;
      background: radial-gradient(60% 50% at 85% 10%, rgba(255,255,255,.22) 0%, transparent 60%), linear-gradient(135deg, #FF8A00 0%, #FF5E3A 55%, #F53B57 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .3s ease;
      font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
    }
    #app-splash.hidden { opacity: 0; pointer-events: none; }
    #app-splash img {
      width: 104px; height: 104px; border-radius: 28px; object-fit: cover;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      animation: sp-pop .45s cubic-bezier(.34,1.56,.64,1) both;
    }
    #app-splash h1 { margin: 18px 0 4px; font-size: 34px; font-weight: 900; color: #fff; }
    #app-splash p { margin: 0; font-size: 14px; color: rgba(255,255,255,.88); font-weight: 600; }
    @keyframes sp-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="app-splash" aria-hidden="true">
    <img src="logo.png" alt="" onerror="this.style.display='none'" />
    <h1>وصلّي</h1>
    <p>بوابة المطعم</p>
  </div>

  <div id="root"></div>
  <script>
    (function () {
      var done = false;
      window.__hideSplash = function () {
        if (done) return; done = true;
        var s = document.getElementById('app-splash');
        if (!s) return;
        s.classList.add('hidden');
        setTimeout(function () { s.remove(); }, 320);
      };
      // أمان: لا تتجاوز 1.2 ثانية مهما حدث
      setTimeout(window.__hideSplash, 1200);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
